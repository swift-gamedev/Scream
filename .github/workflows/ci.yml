name: CI

on:
  push:
    branches: [main]
  pull_request:

# Nothing here writes to the repository.
permissions:
  contents: read

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-24.04
    # Keep in step with .swift-version; the first step checks it.
    container: swift:6.4.2-noble
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          persist-credentials: false
      - name: Toolchain matches .swift-version
        run: |
          expected="$(cat .swift-version)"
          swift --version 2>&1 | grep -q "Swift version $expected " || {
            echo "Container has $(swift --version 2>&1 | head -1), .swift-version says $expected"; exit 1; }
      - name: Lint
        run: swift format lint --strict --recursive Sources/Scream Tools Tests Benchmarks Examples Package.swift
      - name: Generated code is up to date
        run: swift run scream-generate --check
      - name: Build
        run: swift build
      - name: Run the console examples
        run: |
          for example in HelloWorld Hierarchy Observers; do
            swift run $example
          done
      - name: Test
        run: swift test
      - name: Test in release
        # The C compile sees NDEBUG here and Swift does not; the layout test checks they agree.
        run: swift test -c release
      - name: Test under the address sanitizer
        # Without XCTest: its runner leaks a few objects of its own that the leak checker reports.
        run: swift test --sanitize=address --disable-xctest
      - name: Test under the thread sanitizer
        # The file lists races inside Flecs that it accepts by design. The path comes from $PWD
        # because github.workspace is the host's path, which does not exist inside this container.
        run: TSAN_OPTIONS="suppressions=$PWD/Tests/tsan-suppressions.txt" swift test --sanitize=thread --disable-xctest
      - name: Build the benchmarks
        run: swift build -c release --product IterationBenchmark
      - name: Documentation
        run: swift package generate-documentation --target Scream --warnings-as-errors
      - name: Install X11, OpenGL and Xvfb for the Swaylib examples
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            libx11-dev libxrandr-dev libxi-dev libxcursor-dev libxinerama-dev libgl1-mesa-dev xvfb
      - name: Run the Swaylib examples unattended
        # A separate package, so Scream itself never depends on Swaylib. Each draws 20 frames into
        # a hidden X server and saves the last one.
        working-directory: Examples/SwaylibExamples
        run: |
          mkdir -p screenshots
          for example in BouncingBalls SolarSystem; do
            SWAYLIB_FRAMES=20 SWAYLIB_SCREENSHOT=screenshots/$example.png xvfb-run -a swift run $example
            test -s screenshots/$example.png
          done
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: screenshots-linux
          path: Examples/SwaylibExamples/screenshots

  wasm:
    name: Wasm
    runs-on: ubuntu-24.04
    container: swift:6.4.2-noble
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          persist-credentials: false
      - name: Install the Swift SDK for Wasm
        # The checksum is the one swift.org publishes for this release; keep both in step with
        # .swift-version.
        run: |
          swift sdk install \
            https://download.swift.org/swift-6.4.2-release/wasm-sdk/swift-6.4.2-RELEASE/swift-6.4.2-RELEASE_wasm.artifactbundle.tar.gz \
            --checksum 83baca83553f8c443cda7b84800912e6e709c3acd2e7ebf277794ca5836c0da5
      - name: Build
        # Only the library: the generator uses Foundation.Process, which WASI does not have.
        run: swift build --swift-sdk swift-6.4.2-RELEASE_wasm --product Scream
      - name: Build in release
        run: swift build -c release --swift-sdk swift-6.4.2-RELEASE_wasm --product Scream
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Run the console examples under Node's WASI
        run: |
          for example in HelloWorld Hierarchy Observers; do
            swift build -c release --swift-sdk swift-6.4.2-RELEASE_wasm --product $example
            node Examples/run-wasm.mjs .build/release/$example.wasm
          done

  macos:
    name: macOS
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          persist-credentials: false
      - name: Install the pinned Swift toolchain
        # swiftly reads .swift-version.
        run: |
          curl -O https://download.swift.org/swiftly/darwin/swiftly.pkg
          installer -pkg swiftly.pkg -target CurrentUserHomeDirectory
          ~/.swiftly/bin/swiftly init --quiet-shell-followup --assume-yes --skip-install
          . ~/.swiftly/env.sh
          swiftly install --use --assume-yes
          echo "$HOME/.swiftly/bin" >> "$GITHUB_PATH"
      - name: Build
        run: swift build
      - name: Run the console examples
        run: |
          for example in HelloWorld Hierarchy Observers; do
            swift run $example
          done
      - name: Test
        run: swift test
      - name: Run the Swaylib examples unattended
        working-directory: Examples/SwaylibExamples
        run: |
          mkdir -p screenshots
          for example in BouncingBalls SolarSystem; do
            SWAYLIB_FRAMES=20 SWAYLIB_SCREENSHOT=screenshots/$example.png swift run $example
            test -s screenshots/$example.png
          done
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: screenshots-macos
          path: Examples/SwaylibExamples/screenshots

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          persist-credentials: false
      - name: Read .swift-version
        id: toolchain
        shell: pwsh
        run: '"version=$((Get-Content .swift-version).Trim())" >> $env:GITHUB_OUTPUT'
      # Pinned to the commit of release v0.5.1.
      - uses: compnerd/gha-setup-swift@9ff1ee4c44888c5817fc14d1b257ac8cabb4935f
        with:
          swift-version: swift-${{ steps.toolchain.outputs.version }}-release
          swift-build: ${{ steps.toolchain.outputs.version }}-RELEASE
      - name: Build
        run: swift build
      - name: Run the console examples
        run: |
          swift run HelloWorld
          swift run Hierarchy
          swift run Observers
      - name: Test
        run: swift test
